name: Numerical regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make all test-c
      - run: ./build/detector_demo > /tmp/detector-demo.csv
      - run: cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer c/test_detector_filter.c c/detector_filter.c -lm -o /tmp/test-detector-sanitized
      - run: /tmp/test-detector-sanitized
      - run: python -m unittest discover -s tests -v
      - run: python src/prototype.py --output /tmp/detector-validation
